# ============================================================
# 3. 操作符单词
# ============================================================
operators:
  - {symbol: "+", op_type: "add", aliases: ["加", "加上", "加于", "＋"]}
  - {symbol: "-", op_type: "sub", aliases: ["减", "减去", "－"]}

# ============================================================
# 4. 标记符号
# ============================================================
markers:
  - {symbol: "=", marker_kind: "equality", aliases: ["等于", "＝", "是"]}
  - {symbol: "?", marker_kind: "question", aliases: ["？", "多少", "几"]}

# ============================================================
# 5. 程序性记忆（算法步骤组合）
# ============================================================
# 算法层级：
#   L0 原子操作 (硬件，不学习)：read_memory / write_memory / search_context / call_algorithm / return_value
#   L1 基础算法 (经验归纳)：counting / mapping / merging / removing
#   L2 运算算法 (组合 L1)：adding / subtracting
#   L2 工作记忆算法 (原子操作包装)：bind_attribute / resolve_pronoun / retrieve_attr
# ============================================================
procedures:

  # ===== L1 基础算法 =====

  - name: "counting"
    algorithm_key: "counting"
    trigger_words: ["多少", "几", "数"]
    description: "计数：对集合逐个数出总数"

  - name: "mapping"
    algorithm_key: "mapping"
    trigger_words: ["映射", "map"]
    description: "把数字映射为对应数量的元素集合"

  - name: "merging"
    algorithm_key: "merging"
    trigger_words: ["合并", "merge"]
    description: "把两个集合合并成一个集合"

  # ===== L2 运算算法（组合 L1）=====
  # 注：removing 算法在 v2 才注册到 AlgorithmRegistry，因此
  #     subtracting 的 steps 中引用 removing 也需 v2 才能完整执行。
  #     v1 阶段 subtracting 由 SubtractingAlgorithm 类直接实现，steps 仅作设计稿。

  - name: "adding"
    algorithm_key: "adding"
    trigger_words: ["+", "加", "加上", "之和"]
    description: "加法：映射两个数→合并集合→计数"
    steps:
      - {action: "mapping", parameters: {operand: "a"}, description: "把 a 映射为集合 A"}
      - {action: "mapping", parameters: {operand: "b"}, description: "把 b 映射为集合 B"}
      - {action: "merging", parameters: {sets: ["A", "B"]}, description: "把 A、B 合并成一个集合"}
      - {action: "counting", parameters: {set: "merged"}, description: "数合并后集合的个数 = a+b"}
    dependencies: ["mapping", "merging", "counting"]

  - name: "subtracting"
    algorithm_key: "subtracting"
    trigger_words: ["-", "减", "减去", "之差"]
    description: "减法：从大集合中去掉小集合后，数剩余"
    steps:
      - {action: "mapping", parameters: {operand: "a"}, description: "把 a 映射为集合 A（被减数）"}
      - {action: "mapping", parameters: {operand: "b"}, description: "把 b 映射为集合 B（减数）"}
      - {action: "removing", parameters: {from: "A", remove: "B"}, description: "从 A 中去掉 B 的元素"}
      - {action: "counting", parameters: {set: "remaining"}, description: "数剩余集合的个数 = a-b"}
    dependencies: ["mapping", "counting"]

# ============================================================
# 5b. 程序性记忆 v2（Phase 3 实施后被代码处理，当前被忽略）
# ============================================================
# 这部分算法需要 v2 的扩展 AlgorithmRegistry 才能注册：
#   - removing           : L1 基础算法，subtracting 依赖它
#   - bind_attribute      : L2 工作记忆算法，对应 write_memory 原子操作
#   - resolve_pronoun    : L2 工作记忆算法，对应 search_context 原子操作
#   - retrieve_attr       : L2 工作记忆算法，对应 read_memory 原子操作
# Phase 3 实施后，把本段合并到 procedures 段即可。
# ============================================================
procedures_v2:

  - name: "removing"
    algorithm_key: "removing"
    trigger_words: ["移除", "remove"]
    description: "从一个集合中移除另一个集合的元素"

  - name: "bind_attribute"
    algorithm_key: "bind_attribute"
    trigger_words: ["的"]
    description: "属性绑定：把 entity.attr=value 写入工作记忆（对应原子操作 write_memory）"
    steps:
      - {action: "write_memory", parameters: {entity: "$entity", attr: "$attr", value: "$value"}, description: "把 entity 的 attr 属性值写入工作记忆"}
    dependencies: []

  - name: "resolve_pronoun"
    algorithm_key: "resolve_pronoun"
    trigger_words: ["他们", "她们", "它们", "他", "她", "它"]
    description: "指代消解：把代词解析为工作记忆中的实体集合（对应原子操作 search_context）"
    steps:
      - {action: "search_context", parameters: {keyword: "$pronoun"}, description: "依据上下文把代词解析为实体列表"}
    dependencies: []

  - name: "retrieve_attr"
    algorithm_key: "retrieve_attr"
    trigger_words: ["年龄", "高度", "重量"]
    description: "属性检索：从工作记忆读取某实体的某属性值（对应原子操作 read_memory）"
    steps:
      - {action: "read_memory", parameters: {entity: "$entity", attr: "$attr"}, description: "从工作记忆读取 entity 的 attr 属性值"}
    dependencies: []

# ============================================================
# 6. 模式定义（v2 新增，Phase 2 实施后被代码处理）
# ============================================================
# 模式以实体形式存于陈述性记忆，PatternMatcher 从知识图谱加载。
# slot 字段：
#   type     词性约束：N(数字)/OP(操作符)/=/?(标记)/CMP(比较号)/word(任意词)
#   literal  字面值约束：null 表示任意；非 null 时要求 token 字面相等
#   capture  捕获变量名：非空时把 token 绑定到该变量
#   optional 是否可选（默认 false）
# ============================================================
patterns:

  # ----- 二元运算提问式：N OP N = ? -----
  - name: "binary_op_question"
    description: "二元运算提问式：A op B = ?（如 1+1=? 、 三加二等于多少）"
    action: "build_dag:binary_op"
    priority: 1.0
    slots:
      - {type: "N",  capture: "left"}
      - {type: "OP", capture: "op"}
      - {type: "N",  capture: "right"}
      - {type: "=",  capture: null}
      - {type: "?",  capture: null}

  # ----- 属性绑定式：entity 的 attr N -----
  - name: "attr_value"
    description: "属性绑定：实体 + 的 + 属性 + 数值（如 爸爸的年龄31）"
    action: "build_dag:attr_value"
    priority: 0.9
    slots:
      - {type: "word", literal: null, capture: "entity"}
      - {type: "word", literal: "的", capture: null}
      - {type: "word", literal: null, capture: "attr"}
      - {type: "N",    capture: "value"}

  # ----- 指代求和式：pronoun 的 attr 之和 = ? -----
  - name: "pronoun_sum"
    description: "指代求和：代词 + 的 + 属性 + 之和 + 是 + 多少（如 他们的年龄之和是多少）"
    action: "build_dag:pronoun_sum"
    priority: 0.8
    slots:
      - {type: "word", literal: null, capture: "pronoun"}
      - {type: "word", literal: "的", capture: null}
      - {type: "word", literal: null, capture: "attr"}
      - {type: "word", literal: "之和", capture: null}
      - {type: "=",    capture: null, optional: true}
      - {type: "?",    capture: null}

  # ----- 指代求差式：pronoun 的 attr 之差 = ? -----
  - name: "pronoun_diff"
    description: "指代求差：代词 + 的 + 属性 + 之差 + 是 + 多少（如 他们的年龄之差是多少）"
    action: "build_dag:pronoun_diff"
    priority: 0.8
    slots:
      - {type: "word", literal: null, capture: "pronoun"}
      - {type: "word", literal: "的", capture: null}
      - {type: "word", literal: null, capture: "attr"}
      - {type: "word", literal: "之差", capture: null}
      - {type: "=",    capture: null, optional: true}
      - {type: "?",    capture: null}

# ============================================================
# 7. 模式样本（v2 新增，Phase 2 实施后被代码处理）
# ============================================================
# 每条样本给出：原始输入 → 期望分词 → 命中模式 → 捕获的槽位
# 用于学习后自测，验证模式匹配正确性
# ============================================================
pattern_samples:

  # ----- 二元运算样本 -----
  - input: "1+1=?"
    tokens: ["1", "+", "1", "=", "?"]
    pattern: "binary_op_question"
    captured: {left: "1", op: "+", right: "1"}

  - input: "10-3=?"
    tokens: ["10", "-", "3", "=", "?"]
    pattern: "binary_op_question"
    captured: {left: "10", op: "-", right: "3"}

  - input: "一加一等于多少"
    tokens: ["一", "加", "一", "等于", "多少"]
    pattern: "binary_op_question"
    captured: {left: "一", op: "加", right: "一"}

  - input: "十减三等于几"
    tokens: ["十", "减", "三", "等于", "几"]
    pattern: "binary_op_question"
    captured: {left: "十", op: "减", right: "三"}

  - input: "5+三=？"
    tokens: ["5", "+", "三", "=", "？"]
    pattern: "binary_op_question"
    captured: {left: "5", op: "+", right: "三"}

  # ----- 属性绑定样本 -----
  - input: "爸爸的年龄31"
    tokens: ["爸爸", "的", "年龄", "31"]
    pattern: "attr_value"
    captured: {entity: "爸爸", attr: "年龄", value: "31"}

  - input: "妈妈的年龄25"
    tokens: ["妈妈", "的", "年龄", "25"]
    pattern: "attr_value"
    captured: {entity: "妈妈", attr: "年龄", value: "25"}

  - input: "爸爸的高度175"
    tokens: ["爸爸", "的", "高度", "175"]
    pattern: "attr_value"
    captured: {entity: "爸爸", attr: "高度", value: "175"}

  # ----- 指代求和样本 -----
  - input: "他们的年龄之和是多少"
    tokens: ["他们", "的", "年龄", "之和", "是", "多少"]
    pattern: "pronoun_sum"
    captured: {pronoun: "他们", attr: "年龄"}

  - input: "他们的年龄之和？"
    tokens: ["他们", "的", "年龄", "之和", "？"]
    pattern: "pronoun_sum"
    captured: {pronoun: "他们", attr: "年龄"}

  # ----- 指代求差样本 -----
  - input: "他们的年龄之差是多少"
    tokens: ["他们", "的", "年龄", "之差", "是", "多少"]
    pattern: "pronoun_diff"
    captured: {pronoun: "他们", attr: "年龄"}

  # ----- 完整应用题样本（多句合并）-----
  - input: "爸爸的年龄31，妈妈的年龄25，他们的年龄之和是多少？"
    tokens: ["爸爸", "的", "年龄", "31", "，", "妈妈", "的", "年龄", "25", "，", "他们", "的", "年龄", "之和", "是", "多少", "？"]
    pattern: "mixed_app_problem"
    captured: {note: "应同时命中两条 attr_value 与一条 pronoun_sum"}

