# ============================================================
# 知识包：基础知识包（base_curriculum）
# ============================================================
# 用途：整合小学一年级数学、一年级语文、分词技能、指代消解
#       等通用能力为一套"基础课程"，一次 learn 即可习得
# 学习方式：人工执行 learn base_curriculum 命令
# 未学习此包时，大脑不具备相关知识，无法回答相关问题
#
# 内容覆盖：
#   - 数学：0-20 数字、加减运算、5 条基础算法
#   - 语文：一年级 83 个字词（含拼音、释义、词性）
#   - 分词技能：数字合并、多字词边界、应用题分词
#   - 指代消解：属性绑定、代词消解、属性检索 3 条算法
#   - 模式：二元运算、属性绑定、指代求和 3 个模式
#
# 兼容性说明：
#   - 当前 v1 代码的 learn_from_package 只处理前 6 段
#     (words/numbers/operators/markers/procedures/tokenizer_examples)
#   - patterns / pattern_samples / procedures_v2 三段为 v2 设计稿，
#     待变更开发计划 Phase 2-3 实施后被代码处理。
#     在 Phase 2-3 完成前，YAML 中保留这三段不影响学习（被忽略）：
#       * patterns          → Phase 2 实施后由 learn_pattern 处理
#       * pattern_samples   → Phase 2 实施后由 learn_pattern_sample 处理
#       * procedures_v2     → Phase 3 实施后由扩展的 learn_procedure 处理
#     （v2 算法需要新的 AlgorithmRegistry 注册 removing/bind_attribute/
#      resolve_pronoun/retrieve_attr 四个 algorithm_key 后才能学习）
# ============================================================

name: "基础知识包"
description: "小学一年级数学 + 一年级语文 + 分词技能 + 指代消解的整合基础课程"

