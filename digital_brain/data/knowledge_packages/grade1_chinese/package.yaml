  - {symbol: "后", pinyin: "hòu",   meaning: "后方；后面",     word_type: "方位词"}

  # ===== 大小多少（量词与形容词）=====
  - {symbol: "大", pinyin: "dà",    meaning: "体积大；大",     word_type: "形容词"}
  - {symbol: "小", pinyin: "xiǎo",  meaning: "体积小；小",     word_type: "形容词"}
  - {symbol: "多", pinyin: "duō",   meaning: "数量多；多",     word_type: "形容词"}
  - {symbol: "少", pinyin: "shǎo",  meaning: "数量少；少",     word_type: "形容词"}
  - {symbol: "个", pinyin: "gè",    meaning: "量词；一个",     word_type: "量词"}
  - {symbol: "只", pinyin: "zhī",   meaning: "量词；一只",     word_type: "量词"}
  - {symbol: "头", pinyin: "tóu",   meaning: "量词；头",       word_type: "量词"}
  - {symbol: "条", pinyin: "tiáo",  meaning: "量词；一条",     word_type: "量词"}

  # ===== 人物称谓 =====
  - {symbol: "爸", pinyin: "bà",    meaning: "父亲",           word_type: "称谓"}
  - {symbol: "妈", pinyin: "mā",    meaning: "母亲",           word_type: "称谓"}
  - {symbol: "爸", pinyin: "bà ba", meaning: "父亲",           word_type: "名词", aliases: ["爸爸"]}
  - {symbol: "妈", pinyin: "mā ma", meaning: "母亲",           word_type: "名词", aliases: ["妈妈"]}
  - {symbol: "老", pinyin: "lǎo",   meaning: "年长；老师中的老", word_type: "形容词"}
  - {symbol: "师", pinyin: "shī",   meaning: "老师；师傅",     word_type: "名词", aliases: ["老师"]}
  - {symbol: "同", pinyin: "tóng",  meaning: "相同；一起",     word_type: "形容词"}
  - {symbol: "学", pinyin: "xué",   meaning: "学习；学问",     word_type: "动词", aliases: ["同学"]}

  # ===== 常用动作 =====
