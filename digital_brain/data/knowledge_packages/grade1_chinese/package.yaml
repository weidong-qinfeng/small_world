# ---- 分词样本（教分词器认识多字词的边界）----
tokenizer_examples:
  - {input: "天地人",           expected_tokens: ["天", "地", "人"]}
  - {input: "金木水火土",       expected_tokens: ["金", "木", "水", "火", "土"]}
  - {input: "口耳目手足",       expected_tokens: ["口", "耳", "目", "手", "足"]}
  - {input: "日月山石田禾",     expected_tokens: ["日", "月", "山", "石", "田", "禾"]}
  - {input: "云雨风雪花鸟树虫", expected_tokens: ["云", "雨", "风", "雪", "花", "鸟", "树", "虫"]}
  - {input: "上下左右前后",     expected_tokens: ["上", "下", "左", "右", "前", "后"]}
  - {input: "大小多少",         expected_tokens: ["大", "小", "多", "少"]}
  - {input: "爸爸妈妈",         expected_tokens: ["爸爸", "妈妈"]}
  - {input: "学校读书写字",     expected_tokens: ["学校", "读书", "写字"]}
  - {input: "中国朋友快乐",     expected_tokens: ["中国", "朋友", "快乐"]}
  - {input: "太阳月亮白天晚上", expected_tokens: ["太阳", "月亮", "白天", "晚上"]}
  - {input: "春天来了",         expected_tokens: ["春", "天", "来", "了"]}
