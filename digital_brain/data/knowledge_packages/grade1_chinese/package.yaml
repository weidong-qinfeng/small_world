  - {symbol: "走", pinyin: "zǒu",   meaning: "走；行走",       word_type: "动词"}
  - {symbol: "跑", pinyin: "pǎo",   meaning: "跑；奔跑",       word_type: "动词"}
  - {symbol: "吃", pinyin: "chī",   meaning: "吃；进食",       word_type: "动词"}
  - {symbol: "喝", pinyin: "hē",    meaning: "喝；饮用",       word_type: "动词"}

  # ===== 季节与时间 =====
