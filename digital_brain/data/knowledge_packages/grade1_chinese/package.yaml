# ============================================================
# 知识包：小学一年级语文（上册 + 下册核心内容）
# ============================================================
# 用途：教大脑掌握一年级语文识字要求
# 内容：按教材单元编排的生字、词语，含拼音、释义、词性
# 学习方式：人工执行 learn grade1_chinese 命令
# 未学习此包时，大脑不认识这些字词，无法理解相关文本
# 教材依据：部编版（人教版）小学语文一年级
# ============================================================

name: "小学一年级语文"
description: "一年级语文核心识字：天地人、自然事物、方位、人称、动作、形容词、常用词语"

# ---- 生字（含义：每个字的读音、意思、词性）----
words:

  # ===== 第一单元：天地人 =====
  - {symbol: "天", pinyin: "tiān",   meaning: "天空；天",       word_type: "名词"}
  - {symbol: "地", pinyin: "dì",     meaning: "大地；土地",     word_type: "名词"}
  - {symbol: "人", pinyin: "rén",    meaning: "人类；人",       word_type: "名词"}
  - {symbol: "你", pinyin: "nǐ",    meaning: "对方；你",       word_type: "代词"}
  - {symbol: "我", pinyin: "wǒ",    meaning: "自己；我",       word_type: "代词"}
  - {symbol: "他", pinyin: "tā",    meaning: "第三人称；他",   word_type: "代词"}

  # ===== 第二单元：金木水火土 =====
  - {symbol: "金", pinyin: "jīn",   meaning: "金属；金子",     word_type: "名词"}
  - {symbol: "木", pinyin: "mù",    meaning: "树木；木头",     word_type: "名词"}
  - {symbol: "水", pinyin: "shuǐ",  meaning: "水；液体",       word_type: "名词"}
  - {symbol: "火", pinyin: "huǒ",   meaning: "火；火焰",       word_type: "名词"}
  - {symbol: "土", pinyin: "tǔ",    meaning: "泥土；土壤",     word_type: "名词"}

  # ===== 第三单元：口耳目 =====
  - {symbol: "口", pinyin: "kǒu",   meaning: "嘴巴；口",       word_type: "名词"}
  - {symbol: "耳", pinyin: "ěr",    meaning: "耳朵；耳",       word_type: "名词"}
  - {symbol: "目", pinyin: "mù",    meaning: "眼睛；目光",     word_type: "名词"}
  - {symbol: "手", pinyin: "shǒu",  meaning: "手；手掌",       word_type: "名词"}
  - {symbol: "足", pinyin: "zú",    meaning: "脚；足够",       word_type: "名词"}

  # ===== 第四单元：日月山石 =====
  - {symbol: "日", pinyin: "rì",    meaning: "太阳；日子",     word_type: "名词"}
  - {symbol: "月", pinyin: "yuè",   meaning: "月亮；月份",     word_type: "名词"}
  - {symbol: "山", pinyin: "shān",  meaning: "山；山脉",       word_type: "名词"}
  - {symbol: "石", pinyin: "shí",   meaning: "石头；岩石",     word_type: "名词"}
  - {symbol: "田", pinyin: "tián",  meaning: "田地；田",       word_type: "名词"}
  - {symbol: "禾", pinyin: "hé",    meaning: "禾苗；庄稼",     word_type: "名词"}

  # ===== 第五单元：对韵歌（自然现象）=====
  - {symbol: "云", pinyin: "yún",   meaning: "云彩；云",       word_type: "名词"}
  - {symbol: "雨", pinyin: "yǔ",    meaning: "雨；雨水",       word_type: "名词"}
  - {symbol: "风", pinyin: "fēng",  meaning: "风；气流",       word_type: "名词"}
  - {symbol: "雪", pinyin: "xuě",   meaning: "雪；雪花",       word_type: "名词"}
  - {symbol: "花", pinyin: "huā",   meaning: "花；花朵",       word_type: "名词"}
  - {symbol: "树", pinyin: "shù",   meaning: "树；树木",       word_type: "名词"}
  - {symbol: "鸟", pinyin: "niǎo",  meaning: "鸟；鸟类",       word_type: "名词"}
  - {symbol: "虫", pinyin: "chóng", meaning: "虫；昆虫",       word_type: "名词"}

  # ===== 方位词 =====
  - {symbol: "上", pinyin: "shàng", meaning: "上方；上面",     word_type: "方位词"}
  - {symbol: "下", pinyin: "xià",   meaning: "下方；下面",     word_type: "方位词"}
  - {symbol: "左", pinyin: "zuǒ",   meaning: "左边；左侧",     word_type: "方位词"}
