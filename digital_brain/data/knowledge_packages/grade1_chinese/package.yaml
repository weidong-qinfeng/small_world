  - {symbol: "夏", pinyin: "xià",   meaning: "夏天；夏季",     word_type: "名词"}
  - {symbol: "秋", pinyin: "qiū",   meaning: "秋天；秋季",     word_type: "名词"}
  - {symbol: "冬", pinyin: "dōng",  meaning: "冬天；冬季",     word_type: "名词"}
  - {symbol: "早", pinyin: "zǎo",   meaning: "早晨；早",       word_type: "时间词"}
  - {symbol: "晚", pinyin: "wǎn",   meaning: "晚上；晚",       word_type: "时间词"}

  # ===== 颜色 =====
  - {symbol: "红", pinyin: "hóng",  meaning: "红色",           word_type: "形容词"}
  - {symbol: "黄", pinyin: "huáng", meaning: "黄色",           word_type: "形容词"}
  - {symbol: "蓝", pinyin: "lán",   meaning: "蓝色",           word_type: "形容词"}
  - {symbol: "绿", pinyin: "lǜ",    meaning: "绿色",           word_type: "形容词"}
  - {symbol: "白", pinyin: "bái",   meaning: "白色",           word_type: "形容词"}
  - {symbol: "黑", pinyin: "hēi",   meaning: "黑色",           word_type: "形容词"}

  # ===== 常用词语（多字词）=====
